[project]
name = "sinew"
version = "0.1.0"
description = "Sinew · company brain on FalkorDB"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "falkordb==1.7.1",
  "mcp==2.2.0",
  "google-genai==2.27.0",
  "phonenumbers==9.0.40",
  "python-dotenv==1.2.4",
  "presidio-analyzer==2.2.364",
  "presidio-anonymizer==2.2.364",
  "spacy==3.8.16",
  "en-core-web-sm",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "Faker==40.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
